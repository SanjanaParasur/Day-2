<!DOCTYPE html>
<html>
<head>
    <title>12e Flexbox</title>

    <style>
        .menu {
            width: 500px;
            border: 1px solid lightgray;
            border-radius: 10px;
            padding: 10px 20px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            margin: 10px 0;
        }

        .number {
            background-color: #287be5;
            color: white;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="menu">

        <div class="row">
            <span>Home</span>
            <span class="number">14</span>
        </div>

        <div class="row">
            <span>Notifications</span>
            <span class="number">3</span>
        </div>

        <div class="row">
            <span>Messages</span>
            <span class="number">5</span>
        </div>

    </div>

</body>
</html>
