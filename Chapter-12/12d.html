<!DOCTYPE html>
<html>
<head>
    <title>12d Flexbox</title>

    <style>
        .container {
            height: 50px;
            border: 1px solid gray;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item {
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="item">item1</div>
        <div class="item">item2</div>
    </div>

</body>
</html>
