<!DOCTYPE html>
<html>
<head>
    <title>13d Gmail Design</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .email {
            width: 550px;
            border: 1px solid #ddd;
            box-shadow: 0 1px 5px #ccc;
            padding: 20px;
            display: flex;
            align-items: center;
        }

        .profile {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: lightgreen;
            margin-right: 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;
        }

        .email-content {
            flex: 1;
        }

        .top {
            display: flex;
            justify-content: space-between;
        }

        .sender {
            font-weight: bold;
            font-size: 18px;
        }

        .time {
            color: gray;
        }

        .subject {
            font-weight: bold;
            margin-top: 5px;
        }

        .message {
            color: gray;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="email">

        <div class="profile">🐱</div>

        <div class="email-content">

            <div class="top">
                <div class="sender">Chewy Promotions</div>
                <div class="time">4:58 PM</div>
            </div>

            <div class="subject">
                Biggest sales of the year!
            </div>

            <div class="message">
                Hey there! We're writing to tell you about our...
            </div>

        </div>

    </div>

</body>
</html>
