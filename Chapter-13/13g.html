<!DOCTYPE html>
<html>
<head>
    <title>13g Twitter Design</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .tweet {
            width: 700px;
            display: flex;
            padding: 20px;
            border: 1px solid #ddd;
        }

        .profile {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: lightgreen;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;
            margin-right: 15px;
        }

        .tweet-content {
            flex: 1;
        }

        .user {
            display: flex;
            gap: 8px;
        }

        .name {
            font-weight: bold;
        }

        .username {
            color: gray;
        }

        .tweet-text {
            margin-top: 8px;
            font-size: 18px;
        }

        .preview {
            display: flex;
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 20px;
            overflow: hidden;
        }

        .preview-image {
            width: 170px;
            height: 130px;
            background-color: lightgray;
        }

        .preview-content {
            padding: 20px;
            flex: 1;
        }

        .website {
            color: gray;
            margin-bottom: 8px;
        }

        .preview-title {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="tweet">

        <div class="profile">🐱</div>

        <div class="tweet-content">

            <div class="user">
                <div class="name">supersimple.dev</div>
                <div class="username">@SuperSimpleDev</div>
            </div>

            <div class="tweet-text">
                What is backend web development? A complete
                overview. New video is up!
            </div>

            <div class="preview">

                <div class="preview-image"></div>

                <div class="preview-content">

                    <div class="website">
                        youtube.com
                    </div>

                    <div class="preview-title">
                        Backend web development - a complete
                        overview (2021)
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
