<!DOCTYPE html>
<html>
<head>
    <title>13f Twitter Layout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        /* Main tweet - horizontal layout */
        .tweet {
            width: 700px;
            padding: 20px;
            display: flex;
        }

        /* Profile picture */
        .profile {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: lightgreen;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;
            margin-right: 15px;
        }

        /* Right side - vertical layout */
        .tweet-content {
            flex: 1;
        }

        /* Name and username - horizontal */
        .user-info {
            display: flex;
            gap: 8px;
        }

        .name {
            font-weight: bold;
            font-size: 18px;
        }

        .username {
            color: gray;
            font-size: 18px;
        }

        /* Tweet text */
        .tweet-text {
            margin-top: 8px;
            font-size: 20px;
        }

        /* Link preview - horizontal */
        .link-preview {
            display: flex;
            margin-top: 20px;

            width: 600px;
            height: 130px;

            border: 1px solid #ccc;
            border-radius: 20px;
            overflow: hidden;
        }

        /* Left side of link preview */
        .preview-image {
            width: 170px;
            background-color: lightgray;
        }

        /* Right side of link preview */
        .preview-content {
            padding: 20px;
            flex: 1;
        }

        .website {
            color: gray;
            font-size: 18px;
        }

        .title {
            margin-top: 10px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="tweet">

        <!-- Profile picture -->
        <div class="profile">
            🐱
        </div>

        <!-- Tweet content -->
        <div class="tweet-content">

            <!-- Name + username -->
            <div class="user-info">
                <div class="name">
                    supersimple.dev
                </div>

                <div class="username">
                    @SuperSimpleDev
                </div>
            </div>

            <!-- Tweet -->
            <div class="tweet-text">
                What is backend web development? A complete
                overview. New video is up!
            </div>

            <!-- Link preview -->
            <div class="link-preview">

                <div class="preview-image">
                </div>

                <div class="preview-content">

                    <div class="website">
                        youtube.com
                    </div>

                    <div class="title">
                        Backend web development - a
                        complete overview (2021)
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
