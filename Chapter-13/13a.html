<!DOCTYPE html>
<html>
<head>
    <title>13a Nested Flexbox</title>

    <style>
        .container {
            display: flex;
            width: 300px;
            height: 100px;
        }

        .item1 {
            width: 100px;
            background-color: lightpink;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .item2 {
            width: 200px;
            background-color: lightblue;
        }

        .text {
            background-color: black;
            color: white;
            padding: 5px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="item1">
            <div class="text">item1</div>
        </div>

        <div class="item2"></div>

    </div>

</body>
</html>
