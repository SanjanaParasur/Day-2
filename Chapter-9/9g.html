<!DOCTYPE html>
<html>
<head>
    <title>Exercise 9g</title>
    <style>
        .container {
            display: flex;
            gap: 20px;
            font-family: Arial;
        }

        .card {
            width: 200px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .content {
            padding: 10px;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .friends {
            color: #666;
            margin-bottom: 12px;
        }

        button {
            background-color: #1877f2;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Oliver -->
    <div class="card">
        <img src="cat.jpg">

        <div class="content">
            <div class="name">Oliver</div>
            <div class="friends">2 mutual friends</div>
            <button>Add Friend</button>
        </div>
    </div>

    <!-- Mimi -->
    <div class="card">
        <img src="cat2.jpg">

        <div class="content">
            <div class="name">Mimi</div>
            <div class="friends">3 mutual friends</div>
            <button>Add Friend</button>
        </div>
    </div>

    <!-- Rex -->
    <div class="card">
        <img src="dog.jpg">

        <div class="content">
            <div class="name">Rex</div>
            <div class="friends">4 mutual friends</div>
            <button>Add Friend</button>
        </div>
    </div>

</div>

</body>
</html>
