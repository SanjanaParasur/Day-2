<!DOCTYPE html>
<html>
<head>
    <title>Exercise 9f</title>
    <style>
        .card {
            width: 210px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-family: Arial;
        }

        .card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
        }

        .content {
            padding: 10px;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .friends {
            color: #666;
            margin-bottom: 12px;
        }

        button {
            background-color: #1877f2;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="card">

    <img src="cat.jpg">

    <div class="content">
        <div class="name">Oliver</div>

        <div class="friends">2 mutual friends</div>

        <button>Add Friend</button>
    </div>

</div>

</body>
</html>
