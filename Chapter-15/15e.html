<!DOCTYPE html>
<html>
<head>
    <title>Exercise 15e</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial;
        }

        .product {
            position: relative;

            display: inline-block;

            width: 300px;
            padding: 10px;

            border: 1px solid #ccc;
        }

        .product img {
            width: 100%;
            display: block;
        }

        .discount {
            position: absolute;

            top: 10px;
            right: 10px;

            background-color: black;
            color: white;

            padding: 10px;

            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="product">

        <img src="shirt.jpg" alt="Shirt">

        <div class="discount">20% OFF</div>

    </div>

</body>
</html>
