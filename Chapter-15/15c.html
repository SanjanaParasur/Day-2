<!DOCTYPE html>
<html>
<head>
    <title>Exercise 15c</title>

    <style>
        body {
            height: 3000px;
            margin: 0;
        }

        .video-box {
            position: fixed;

            bottom: 20px;
            right: 20px;

            width: 320px;
            height: 180px;

            background-color: gray;

            position: relative;
        }

        .close-button {
            position: absolute;

            top: -15px;
            left: -15px;

            width: 35px;
            height: 35px;

            background-color: black;
            color: white;

            border-radius: 50%;
            border: none;

            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="video-box">

        <button class="close-button">×</button>

    </div>

</body>
</html>
