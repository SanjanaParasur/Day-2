<!DOCTYPE html>
<html>
<head>
    <title>Exercise 15d</title>

    <style>
        body {
            height: 3000px;
            margin: 0;
        }

        .video-container {
            position: fixed;

            bottom: 20px;
            right: 20px;

            width: 320px;
            height: 180px;

            background-color: gray;
        }

        .close-button {
            position: absolute;

            top: -15px;
            left: -15px;

            width: 35px;
            height: 35px;

            background-color: black;
            color: white;

            border: none;
            border-radius: 50%;

            font-size: 20px;
        }

        .timestamp {
            position: absolute;

            bottom: 5px;
            right: 5px;

            background-color: black;
            color: white;

            padding: 3px 5px;

            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="video-container">

        <button class="close-button">×</button>

        <div class="timestamp">0:29</div>

    </div>

</body>
</html>
