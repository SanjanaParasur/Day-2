<!DOCTYPE html>
<html>
<head>
    <title>Amazon Product</title>

    <style>
        .amazon-link {
            color: rgb(0, 113, 133);
            font-size: 20px;
        }

        h1 {
            color: black;
            font-size: 32px;
            font-weight: bold;
        }

        .price {
            color: rgb(0, 118, 0);
            font-size: 20px;
            font-weight: bold;
        }

        .delivery {
            color: black;
            font-size: 18px;
        }

        button {
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
        }

        .cart {
            background-color: rgb(255, 216, 20);
            margin-right: 20px;
        }

        .buy {
            background-color: rgb(255, 164, 28);
        }
    </style>
</head>

<body>

    <a class="amazon-link" href="#">Back to Amazon</a>

    <h1>Nike Black Running Shoes</h1>

    <p class="price">$39 - in stock.</p>

    <p class="delivery">Free delivery tomorrow.</p>

    <button class="cart">Add to Cart</button>
    <button class="buy">Buy now</button>

</body>
</html>
