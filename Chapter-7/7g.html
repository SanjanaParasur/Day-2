<!DOCTYPE html>
<html>
<head>
    <title>7g</title>

    <style>
        .tweet-box {
            width: 600px;
            height: 80px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: Arial;
        }

        img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 20px;
        }

        button {
            background-color: #1d9bf0;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 22px;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="tweet-box">

        <img src="cat.jpg" alt="Profile">

        <input type="text" placeholder="What's happening?">

        <button>Tweet</button>

    </div>

</body>
</html>
