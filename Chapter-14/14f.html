<!DOCTYPE html>
<html>
<head>
    <title>14f Discord Sidebar</title>

    <style>
        body {
            height: 3000px;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            position: fixed;

            left: 0;
            top: 0;
            bottom: 0;

            display: flex;
        }

        /* First sidebar */
        .server-sidebar {
            width: 90px;
            background-color: #202225;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding-top: 20px;
        }

        .server {
            width: 50px;
            height: 50px;

            border-radius: 50%;

            background-color: #3498db;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 15px;

            font-size: 25px;
        }

        /* Second sidebar */
        .channel-sidebar {
            width: 240px;
            background-color: #2f3136;
            color: #ddd;

            padding: 20px;
        }

        .info {
            display: flex;
            justify-content: space-between;

            font-weight: bold;
            margin-bottom: 20px;
        }

        .channel {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="sidebar">

        <div class="server-sidebar">

            <div class="server">🐱</div>

            <div class="server">🐶</div>

            <div class="server">🐹</div>

        </div>


        <div class="channel-sidebar">

            <div class="info">
                <span>INFO</span>
                <span>+</span>
            </div>

            <div class="channel">
                # new-videos
            </div>

            <div class="channel">
                # updates
            </div>

            <div class="channel">
                # faq
            </div>

        </div>

    </div>

</body>
</html>
