<!DOCTYPE html>
<html>
<head>
    <title>Uber Request a Ride</title>

    <style>
        .uber {
            width: 530px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 40px;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 35px;
        }

        .location {
            display: block;
            width: 100%;
            height: 65px;
            margin-bottom: 12px;
            padding-left: 25px;
            font-size: 18px;
            background-color: #f1f1f1;
            border: none;
            box-sizing: border-box;
        }

        .buttons {
            margin-top: 45px;
        }

        .request {
            background-color: black;
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 18px;
            margin-right: 25px;
        }

        .schedule {
            background-color: #f1f1f1;
            color: black;
            border: none;
            padding: 18px 30px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="uber">

        <h1>Request a ride now</h1>

        <input
            class="location"
            type="text"
            placeholder="Enter pickup location">

        <input
            class="location"
            type="text"
            placeholder="Enter destination">

        <div class="buttons">

            <button class="request">
                Request now
            </button>

            <button class="schedule">
                Schedule for later
            </button>

        </div>

    </div>

</body>
</html>
