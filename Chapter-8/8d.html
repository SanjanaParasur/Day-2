<!DOCTYPE html>
<html>
<head>
    <title>Sign Up Form</title>

    <style>
        .signup {
            width: 480px;
            padding: 20px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        .name {
            display: inline-block;
            width: 48%;
            height: 55px;
            padding-left: 20px;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .last-name {
            margin-left: 3%;
        }

        .email {
            display: block;
            width: 100%;
            height: 55px;
            margin-top: 18px;
            padding-left: 20px;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .signup-button {
            display: block;
            width: 100%;
            height: 60px;
            margin-top: 18px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="signup">

        <input class="name" type="text" placeholder="First name">

        <input class="name last-name" type="text" placeholder="Last name">

        <input class="email" type="email" placeholder="Email">

        <button class="signup-button">Sign Up</button>

    </div>

</body>
</html>
