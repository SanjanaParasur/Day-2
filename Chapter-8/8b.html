<!DOCTYPE html>
<html>
<head>
    <title>Exercise 8b</title>

    <style>
        .box {
            width: 540px;
            border: 1px solid #ddd;
            padding: 15px;
        }

        p {
            width: 370px;
            display: inline-block;
            vertical-align: middle;
            font-size: 22px;
            margin: 0;
        }

        button {
            display: inline-block;
            vertical-align: middle;
            font-size: 18px;
            padding: 8px 15px;
            margin-left: 5px;
        }
    </style>
</head>

<body>

    <div class="box">

        <p>
            Thanks for chatting with our customer support.
            Would you like to take our quick survey?
        </p>

        <button>Yes</button>
        <button>No</button>

    </div>

</body>
</html>
