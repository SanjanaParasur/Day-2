<!DOCTYPE html>
<html>
<head>
    <title>Google Search</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .google {
            font-size: 80px;
            font-weight: bold;
            text-align: center;
            margin-top: 80px;
            margin-bottom: 20px;
        }

        .blue {
            color: #4285F4;
        }

        .red {
            color: #EA4335;
        }

        .yellow {
            color: #FBBC05;
        }

        .green {
            color: #34A853;
        }

        .search-box {
            width: 550px;
            height: 45px;
            border: 1px solid #ddd;
            border-radius: 25px;
            padding-left: 20px;
            font-size: 18px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.15);
            display: block;
            margin: auto;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="google">
        <span class="blue">G</span>
        <span class="red">o</span>
        <span class="yellow">o</span>
        <span class="blue">g</span>
        <span class="green">l</span>
        <span class="red">e</span>
    </div>

    <input
        class="search-box"
        type="text"
        placeholder="Search Google or type a URL">

</body>
</html>
