<!DOCTYPE html>
<html>
<head>
    <title>11c CSS Grid</title>

    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            column-gap: 20px;
            row-gap: 10px;
        }

        .box {
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <div class="grid">
        <div class="box">col1</div>
        <div class="box">col2</div>
        <div class="box">col3</div>
        <div class="box">col4</div>

        <div class="box">col1</div>
        <div class="box">col2</div>
        <div class="box">col3</div>
        <div class="box">col4</div>
    </div>

</body>
</html>
