<!DOCTYPE html>
<html>
<head>
    <title>11d CSS Grid</title>

    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: 20px auto;
        }

        .card {
            box-shadow: 0 0 5px gray;
            background-color: white;
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .name {
            font-size: 22px;
            font-weight: bold;
            padding: 10px;
        }

        .friends {
            padding: 0 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile {
            width: 35px !important;
            height: 35px !important;
            border-radius: 50%;
        }

        button {
            margin: 10px;
            padding: 10px 20px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="grid">

        <div class="card">
            <img src="cat1.jpg">
            <div class="name">Oliver</div>

            <div class="friends">
                <img class="profile" src="cat1.jpg">
                <span>2 mutual friends</span>
            </div>

            <button>Add Friend</button>
        </div>


        <div class="card">
            <img src="cat2.jpg">
            <div class="name">Mimi</div>

            <div class="friends">
                <img class="profile" src="cat1.jpg">
                <span>3 mutual friends</span>
            </div>

            <button>Add Friend</button>
        </div>


        <div class="card">
            <img src="dog.jpg">
            <div class="name">Rex</div>

            <div class="friends">
                <img class="profile" src="cat1.jpg">
                <span>4 mutual friends</span>
            </div>

            <button>Add Friend</button>
        </div>

    </div>

</body>
</html>
