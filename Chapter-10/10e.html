<!DOCTYPE html>
<html>
<head>
    <title>Exercise 10e</title>

    <style>
        body {
            font-family: Arial;
        }

        .card {
            width: 210px;
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
            box-shadow: 0 1px 6px gray;
        }

        .image-container {
            width: 210px;
            height: 220px;
        }

        .main-image {
            width: 210px;
            height: 220px;
            object-fit: cover;
        }

        .details {
            padding: 10px;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .friends {
            margin-bottom: 10px;
        }

        .small-image {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            vertical-align: middle;
        }

        .mutual {
            display: inline-block;
            vertical-align: middle;
            color: gray;
            margin-left: 5px;
        }

        .button-container {
            margin-top: 8px;
        }

        .add-button {
            background-color: #1877f2;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 16px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="image-container">
        <img class="main-image" src="oliver.jpg">
    </div>

    <div class="details">

        <div class="name">
            Oliver
        </div>

        <div class="friends">

            <img class="small-image" src="friend.jpg">

            <div class="mutual">
                2 mutual friends
            </div>

        </div>

        <div class="button-container">
            <button class="add-button">
                Add Friend
            </button>
        </div>

    </div>

</div>


<div class="card">

    <div class="image-container">
        <img class="main-image" src="mimi.jpg">
    </div>

    <div class="details">

        <div class="name">
            Mimi
        </div>

        <div class="friends">

            <img class="small-image" src="friend.jpg">

            <div class="mutual">
                3 mutual friends
            </div>

        </div>

        <div class="button-container">
            <button class="add-button">
                Add Friend
            </button>
        </div>

    </div>

</div>


<div class="card">

    <div class="image-container">
        <img class="main-image" src="rex.jpg">
    </div>

    <div class="details">

        <div class="name">
            Rex
        </div>

        <div class="friends">

            <img class="small-image" src="friend.jpg">

            <div class="mutual">
                4 mutual friends
            </div>

        </div>

        <div class="button-container">
            <button class="add-button">
                Add Friend
            </button>
        </div>

    </div>

</div>

</body>
</html>
