<!DOCTYPE html>
<html>
<head>
    <title>Exercise 10d</title>

    <style>
        body {
            font-family: Arial;
        }

        .card {
            width: 210px;
            height: 350px;
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
            box-shadow: 0 1px 6px gray;
        }

        .main-image {
            width: 210px;
            height: 220px;
            object-fit: cover;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
            margin: 10px;
        }

        .friend-info {
            margin: 10px;
            color: gray;
        }

        .small-image {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            vertical-align: middle;
        }

        .mutual {
            display: inline-block;
            vertical-align: middle;
            margin-left: 5px;
        }

        .add-button {
            margin: 10px;
            background-color: #1877f2;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 16px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="card">

    <img class="main-image" src="oliver.jpg">

    <div class="name">
        Oliver
    </div>

    <div class="friend-info">
        <img class="small-image" src="friend.jpg">

        <div class="mutual">
            2 mutual friends
        </div>
    </div>

    <button class="add-button">
        Add Friend
    </button>

</div>


<div class="card">

    <img class="main-image" src="mimi.jpg">

    <div class="name">
        Mimi
    </div>

    <div class="friend-info">
        <img class="small-image" src="friend.jpg">

        <div class="mutual">
            3 mutual friends
        </div>
    </div>

    <button class="add-button">
        Add Friend
    </button>

</div>


<div class="card">

    <img class="main-image" src="rex.jpg">

    <div class="name">
        Rex
    </div>

    <div class="friend-info">
        <img class="small-image" src="friend.jpg">

        <div class="mutual">
            4 mutual friends
        </div>
    </div>

    <button class="add-button">
        Add Friend
    </button>

</div>

</body>
</html>
