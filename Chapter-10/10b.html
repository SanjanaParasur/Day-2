<!DOCTYPE html>
<html>
<head>
    <title>Exercise 10b</title>

    <style>
        body {
            font-family: Arial;
        }

        .container {
            width: 550px;
        }

        .profile {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
        }

        .profile-image {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            vertical-align: middle;
        }

        .profile-info {
            display: inline-block;
            vertical-align: middle;
            margin-left: 15px;
            width: 300px;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
        }

        .description {
            font-size: 18px;
            color: gray;
            margin-top: 5px;
        }

        .popular {
            font-size: 16px;
            color: gray;
            margin-top: 5px;
        }

        .follow {
            background-color: #1e90ff;
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="profile">
        <img class="profile-image" src="oliver.jpg">

        <div class="profile-info">
            <div class="name">oliver</div>
            <div class="description">the cat</div>
            <div class="popular">Popular</div>
        </div>

        <button class="follow">Follow</button>
    </div>


    <div class="profile">
        <img class="profile-image" src="mimi.jpg">

        <div class="profile-info">
            <div class="name">Mimi</div>
            <div class="description">Sleepy Cat</div>
            <div class="popular">Popular</div>
        </div>

        <button class="follow">Follow</button>
    </div>


    <div class="profile">
        <img class="profile-image" src="rex.jpg">

        <div class="profile-info">
            <div class="name">Rex</div>
            <div class="description">Happy Bulldog</div>
            <div class="popular">Popular</div>
        </div>

        <button class="follow">Follow</button>
    </div>

</div>

</body>
</html>
