<!DOCTYPE html>
<html>
<head>
    <title>Exercise 10a</title>

    <style>
        body {
            font-family: Arial;
        }

        .profile {
            width: 600px;
            padding: 20px;
            display: inline-block;
        }

        .profile-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            vertical-align: middle;
        }

        .profile-info {
            display: inline-block;
            vertical-align: middle;
            margin-left: 20px;
            width: 300px;
        }

        .name {
            font-size: 22px;
            font-weight: bold;
        }

        .description {
            font-size: 20px;
            color: gray;
            margin-top: 8px;
        }

        .popular {
            font-size: 18px;
            color: gray;
            margin-top: 8px;
        }

        .follow {
            background-color: #1e90ff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="profile">

    <img class="profile-image" src="oliver.jpg">

    <div class="profile-info">
        <div class="name">oliver</div>
        <div class="description">the cat</div>
        <div class="popular">Popular</div>
    </div>

    <button class="follow">Follow</button>

</div>

</body>
</html>
